# Full stack for the WSL2 / GPU host (PRD §15, §32-34).
# Prototype defaults work with ZERO infra (fakeredis + SQLite + numpy vectors).
# Uncomment/set URLs below to use the real backing services.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./demo_videos:/app/demo_videos", "./config.yaml:/app/config.yaml"]
    environment:
      # DATABASE_URL: postgresql+psycopg://vsd:vsd@postgres:5432/vsd
      # REDIS_URL: redis://redis:6379/0
      VSD_CONFIG: /app/config.yaml
    # depends_on: [redis, postgres, qdrant]  # when using real infra

